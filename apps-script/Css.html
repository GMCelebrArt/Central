<style>
/* ═══ SHELL ═══ */

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#faf6f2;min-height:100vh}
.shell-topo{background:#fff;border-bottom:1px solid #ece2d8;padding:14px 16px 0;text-align:center}
.shell-marca .serifa{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;color:#c9607c;display:block;line-height:1.1}
.shell-marca .sub{font-family:'Jost',sans-serif;font-size:10px;letter-spacing:.35em;text-transform:uppercase;color:#b09a9e}
.shell-tabs{display:flex;gap:4px;max-width:560px;margin:12px auto 0}
.shell-tab{flex:1;padding:12px 4px 13px;border:none;background:none;font-family:'Jost',sans-serif;font-size:13.5px;
  font-weight:500;color:#9a8388;cursor:pointer;border-bottom:2.5px solid transparent}
.shell-tab.sel{color:#c9607c;border-bottom-color:#c9607c}
.aba{display:none}
.aba.ativa{display:block}
@media print{
  body.modo-contrato .shell-topo, body.modo-checklist .shell-topo,
  body.modo-contrato #aba-orcamento, body.modo-checklist #aba-orcamento,
  body.modo-contrato #aba-proposta, body.modo-checklist #aba-proposta{display:none!important}
  body.modo-contrato #aba-contrato, body.modo-checklist #aba-contrato{display:block!important}
}

/* ═══ ABA ORÇAMENTO ═══ */

#aba-orcamento{--rose:#c97b8a;--rose-deep:#6b2737;--gold:#c8a04e;--ink:#2a1f22;
  --paper:#fff8f4;--line:#ecdadd;
  font-family:'Jost',system-ui,sans-serif;color:var(--ink);
  padding:18px 14px 80px;max-width:560px;margin:0 auto}
#aba-orcamento .card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;
  box-shadow:0 12px 30px -20px rgba(107,39,55,.4)}
#aba-orcamento .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--rose);font-weight:500;margin-bottom:10px;display:block}
#aba-orcamento .kits{display:flex;gap:8px;flex-wrap:wrap}
#aba-orcamento .kit{flex:1 1 0;min-width:70px;padding:13px 6px;border:1.5px solid var(--line);border-radius:12px;background:#fff;
  font-family:'Jost';font-weight:500;font-size:14px;color:var(--rose-deep);cursor:pointer;transition:.15s}
#aba-orcamento .kit:active{transform:scale(.97)}
#aba-orcamento .kit.clear{color:#9a7b80}
#aba-orcamento ul{list-style:none}
#aba-orcamento li.item{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid #f3e8ea;cursor:pointer}
#aba-orcamento li.item:last-child{border-bottom:none}
#aba-orcamento .box{width:24px;height:24px;border:2px solid var(--line);border-radius:7px;flex-shrink:0;display:flex;
  align-items:center;justify-content:center;font-size:15px;color:#fff;transition:.12s}
#aba-orcamento li.on .box{background:var(--rose);border-color:var(--rose)}
#aba-orcamento .nm{flex:1;font-size:15px}
#aba-orcamento li.on .nm{font-weight:500}
#aba-orcamento .vl{font-size:14px;color:#8a6b70;font-variant-numeric:tabular-nums}
#aba-orcamento li.on .vl{color:var(--rose-deep);font-weight:500}
#aba-orcamento .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}
#aba-orcamento .row:last-child{margin-bottom:0}
#aba-orcamento .row span{font-size:14px}
#aba-orcamento .row input{width:120px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-family:'Jost';
  font-size:15px;text-align:right;background:#fff}
#aba-orcamento .row input:focus{outline:none;border-color:var(--rose)}
#aba-orcamento .pct{display:flex;align-items:center;gap:8px}
#aba-orcamento .pct input{width:64px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-family:'Jost';font-size:15px;text-align:right;background:#fff}
#aba-orcamento .ponte{width:100%;padding:13px;border:1.5px dashed var(--rose);border-radius:12px;background:#fff5f6;
  color:var(--rose-deep);font-family:'Jost';font-size:14px;font-weight:500;cursor:pointer;margin-bottom:12px}
#aba-orcamento .ponte:active{transform:scale(.99)}
#aba-orcamento .total{position:sticky;bottom:14px;background:linear-gradient(135deg,var(--rose-deep),var(--rose));color:#fff;
  border-radius:16px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 16px 34px -14px rgba(107,39,55,.7);margin-top:4px}
#aba-orcamento .total .t1{font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
#aba-orcamento .total .t2{font-family:'Cormorant Garamond',serif;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
#aba-orcamento .total button{background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:10px;padding:10px 14px;
  font-family:'Jost';font-size:13px;cursor:pointer;font-weight:500}
#aba-orcamento .total button:active{background:rgba(255,255,255,.3)}
#aba-orcamento .save{font-size:12px;color:var(--rose);text-align:center;margin-top:10px;cursor:pointer;text-decoration:underline}
#aba-orcamento .saverow{display:none;gap:8px;margin-top:10px}
#aba-orcamento .saverow.show{display:flex}
#aba-orcamento .saverow button{flex:1;padding:10px;border:1px dashed var(--rose);background:#fff5f6;color:var(--rose-deep);
  border-radius:9px;font-size:12px;cursor:pointer;font-family:'Jost'}
#aba-orcamento .hint{font-size:11px;color:#a98f94;text-align:center;margin-top:8px}
#aba-orcamento .kit.on{background:var(--rose-deep);color:#fff;border-color:var(--rose-deep)}
#aba-orcamento .addrow{display:flex;gap:7px;margin-top:12px;border-top:1px solid #f3e8ea;padding-top:12px}
#aba-orcamento .addrow input{padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-family:'Jost';font-size:14px;background:#fff}
#aba-orcamento .addrow input:focus{outline:none;border-color:var(--rose)}
#aba-orcamento .addrow .an{flex:1;min-width:0}
#aba-orcamento .addrow .av{width:86px;text-align:right}
#aba-orcamento .addrow button{flex:0 0 42px;border:1px solid var(--rose);background:#fff5f6;color:var(--rose-deep);border-radius:9px;font-size:19px;cursor:pointer}
#aba-orcamento .addrow input.erro{border-color:#c0392b;background:#fdf1ef}
#aba-orcamento li.item .rm{flex:0 0 26px;width:26px;height:26px;border:none;background:#f6e9ec;color:#a05563;border-radius:7px;font-size:13px;cursor:pointer;line-height:1}
#aba-orcamento li.item .ed{flex:0 0 26px;width:26px;height:26px;border:none;background:#eef0f7;color:#5a6b96;border-radius:7px;font-size:12px;cursor:pointer;line-height:1;margin-left:2px}
#aba-orcamento li.item.editando{gap:6px;background:#fdf7f8;border-radius:8px;padding:8px 6px}
#aba-orcamento li.item.editando input{border:1px solid #e6d3d8;border-radius:7px;padding:7px 8px;font:inherit;font-size:.85rem;min-width:0;background:#fff}
#aba-orcamento li.item.editando .ed-nome{flex:1 1 auto}
#aba-orcamento li.item.editando .ed-valor{flex:0 0 80px;width:80px}
#aba-orcamento li.item.editando .ed-ok,#aba-orcamento li.item.editando .ed-cancel{flex:0 0 30px;width:30px;height:30px;border:none;border-radius:7px;font-size:13px;cursor:pointer;line-height:1}
#aba-orcamento li.item.editando .ed-ok{background:#dff1e4;color:#2f7a45}
#aba-orcamento li.item.editando .ed-cancel{background:#f6e9ec;color:#a05563}
#aba-orcamento li.item.editando input.erro{border-color:#d9534f;background:#fdf1f1}
#aba-orcamento li.item.editando .ed-cat{flex:1 1 100%;order:3;border:1px solid #e6d3d8;border-radius:7px;padding:7px 8px;font:inherit;font-size:.8rem;background:#fff;margin-top:6px}
#aba-orcamento li.item.editando{flex-wrap:wrap}
#aba-orcamento li.cat-cab{display:flex;align-items:center;gap:8px;padding:14px 4px 6px;border-bottom:none;cursor:default;list-style:none}
#aba-orcamento li.cat-cab:first-child{padding-top:4px}
#aba-orcamento li.cat-cab{cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;border-radius:9px;transition:background .15s}
#aba-orcamento li.cat-cab:active{background:#fbf1f3}
#aba-orcamento li.cat-cab.aberta{background:#fdf7f8}
#aba-orcamento li.cat-cab .cat-seta{flex:0 0 14px;font-size:.7rem;color:#c9a3ad;line-height:1}
#aba-orcamento li.cat-cab .cat-nome{font-family:'Cormorant Garamond',serif;font-size:1.02rem;color:#c9607c;letter-spacing:.02em}
#aba-orcamento li.cat-cab .cat-cont.tem{background:#c9607c;color:#fff;border-radius:20px;padding:1px 8px;font-size:.68rem}
#aba-orcamento .acervo-topo{display:flex;align-items:center;justify-content:space-between;gap:10px}
#aba-contrato.mod-pm .so-mon{display:none!important}#aba-contrato.mod-montado .so-pm{display:none!important}
#aba-proposta .sinal-linha{display:flex;gap:6px}#aba-proposta .sinal-linha input{flex:1;min-width:0}#aba-proposta .sinal-linha select{flex:0 0 64px}
#aba-orcamento .mod-toggle{display:flex;gap:6px;margin:4px 0 10px;background:#f6eef0;border-radius:11px;padding:4px}
#aba-orcamento .mod-toggle button{flex:1;border:none;background:transparent;padding:9px 6px;border-radius:8px;font:inherit;font-size:.8rem;color:#8a6b70;cursor:pointer}
#aba-orcamento .mod-toggle button.on{background:#fff;color:#c9607c;box-shadow:0 1px 4px rgba(0,0,0,.08);font-weight:500}
#aba-orcamento .publicar{margin-top:14px;padding-top:12px;border-top:1px solid #f3e8ea;display:flex;flex-direction:column;gap:6px}
#aba-orcamento #bt-recarregar-acervo{padding:11px 14px;border:none;border-radius:10px;background:#c9607c;color:#fff;font:inherit;font-size:.85rem;cursor:pointer}
#aba-orcamento #bt-recarregar-acervo:disabled{opacity:.6}
#aba-orcamento .orc-aviso{display:none;margin-top:10px;padding:10px 12px;border-radius:9px;font-size:.78rem;line-height:1.35}
#aba-orcamento .orc-aviso.on{display:block}
#aba-orcamento .orc-aviso.erro{background:#fdf1f1;border:1px solid #f0c9c9;color:#a33}
#aba-orcamento .orc-aviso.ok{background:#eef7f0;border:1px solid #c9e6d2;color:#2f7a45}
#aba-orcamento #bt-limpar{flex:0 0 auto;padding:6px 12px;font-size:.72rem;border:1px solid #eddfe3;background:#fff;color:#a05563;border-radius:20px;cursor:pointer}
#aba-orcamento li.cat-cab .cat-tag{font-size:.63rem;color:#9c8a8f;background:#f6eef0;border-radius:20px;padding:2px 8px;white-space:nowrap}
#aba-orcamento li.cat-cab .cat-cont{margin-left:auto;font-size:.7rem;color:#b09aa0}
#aba-orcamento li.cat-cab.oculta .cat-nome{color:#7d8aa8}

/* ═══ ABA PROPOSTA (escopo #aba-proposta) ═══ */
#aba-proposta{
  --creme:#faf6f2; --texto:#2a2a2a; --rosa:#e8a0b4; --rosa-escuro:#c9607c;
  --azul:#90b8d0; --azul-escuro:#5080a0; --sub:#888;
  --linha:#ece2d8; --sombra:0 8px 30px rgba(120,90,80,.10); --raio:18px;
}#aba-proposta{margin:0; padding:0}#aba-proposta{
  font-family:'Jost',sans-serif; color:var(--texto); background:var(--creme);
  font-size:15px; line-height:1.5;
}#aba-proposta .serif{font-family:'Cormorant Garamond',serif}/* topo */
#aba-proposta .topo{
  position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:12px;
  padding:10px 18px; background:rgba(250,246,242,.92); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--linha);
}#aba-proposta .topo img{width:34px; height:34px; object-fit:contain}#aba-proposta .topo h1{font-family:'Cormorant Garamond',serif; font-size:21px; font-weight:600; margin:0; line-height:1}#aba-proposta .topo .et{font-family:'Jost',sans-serif; font-size:10.5px; letter-spacing:2px; color:var(--rosa-escuro); text-transform:uppercase}#aba-proposta .topo .dir{margin-left:auto; display:flex; gap:8px}#aba-proposta .ic{
  width:40px; height:40px; border-radius:12px; border:1px solid var(--linha);
  background:#fff; font-size:17px; cursor:pointer; display:flex; align-items:center; justify-content:center;
}#aba-proposta .ic:active{transform:scale(.94)}/* layout */
#aba-proposta .envoltorio{max-width:1280px; margin:0 auto; padding:16px}@media (min-width:1000px){#aba-proposta .envoltorio{display:grid; grid-template-columns:minmax(0,440px) minmax(0,1fr); gap:26px; align-items:start; padding:24px}#aba-proposta .coluna-preview{position:sticky; top:74px}
}/* cartões de formulário */
#aba-proposta .cartao{
  background:#fff; border:1px solid var(--linha); border-radius:var(--raio);
  padding:16px 16px 18px; margin-bottom:14px; box-shadow:var(--sombra);
}#aba-proposta .cartao h2{font-family:'Cormorant Garamond',serif; font-weight:600; font-size:20px; margin:0 0 2px}#aba-proposta .cartao .eyebrow{font-size:10.5px; letter-spacing:2px; text-transform:uppercase; color:var(--rosa-escuro); margin-bottom:6px}#aba-proposta .cartao p.sub{color:var(--sub); font-size:12.5px; margin:0 0 12px}#aba-proposta label{display:block; font-size:12px; color:var(--sub); margin:10px 0 4px; font-weight:500}#aba-proposta input[type=text], #aba-proposta input[type=number], #aba-proposta input[type=date], #aba-proposta textarea, #aba-proposta select{
  width:100%; border:1px solid var(--linha); border-radius:11px; padding:11px 12px;
  font-family:'Jost',sans-serif; font-size:15px; color:var(--texto); background:#fdfbf9;
}#aba-proposta input:focus, #aba-proposta textarea:focus, #aba-proposta select:focus{outline:none; border-color:var(--rosa); background:#fff}#aba-proposta textarea{resize:vertical; min-height:74px; line-height:1.45}#aba-proposta .dupla{display:flex; gap:10px}#aba-proposta .dupla>div{flex:1}#aba-proposta .btn{
  display:block; width:100%; border:none; border-radius:13px; padding:13px;
  font-family:'Jost',sans-serif; font-size:15px; font-weight:500; cursor:pointer; margin-top:10px;
}#aba-proposta .btn:active{transform:scale(.99)}#aba-proposta .primario{background:var(--rosa-escuro); color:#fff}#aba-proposta .secundario{background:#fff; color:var(--texto); border:1px solid var(--linha)}#aba-proposta .linha-botoes{display:flex; gap:8px}#aba-proposta .linha-botoes .btn{margin-top:8px}/* atalhos de kit / extras */
#aba-proposta .chips{display:flex; flex-wrap:wrap; gap:7px; margin:4px 0 2px}#aba-proposta .chip{
  border:1px solid var(--linha); background:#fff; border-radius:20px;
  padding:7px 13px; font-size:12.5px; cursor:pointer; color:var(--texto); white-space:nowrap;
}#aba-proposta .chip:active{transform:scale(.95)}#aba-proposta .chip.kit{border-color:var(--rosa); color:var(--rosa-escuro); font-weight:500}#aba-proposta .chip.kit.sel{background:var(--rosa-escuro); color:#fff; border-color:var(--rosa-escuro)}/* bloco do kit selecionado */
#aba-proposta .kit-box{border:1px solid var(--rosa); background:#fdf6f8; border-radius:14px; padding:13px 13px 14px; margin-top:12px}#aba-proposta .kit-cab{display:flex; align-items:center; gap:9px}#aba-proposta .kit-nome{flex:1; font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:600; color:var(--rosa-escuro)}#aba-proposta .kit-nome-inp{flex:1; font-family:'Cormorant Garamond',serif; font-size:21px; font-weight:600; color:var(--rosa-escuro); background:#fff; border:1px solid #f0d4dd; border-radius:9px; padding:6px 10px}#aba-proposta .kit-cab input{width:96px; text-align:right; background:#fff}#aba-proposta .kit-rem{flex:0 0 auto; width:34px; height:34px; border:none; background:#f3dde4; border-radius:9px; color:var(--rosa-escuro); font-size:17px; cursor:pointer}#aba-proposta .kit-sub{font-size:11.5px; color:var(--sub); margin:11px 0 7px; letter-spacing:.3px}#aba-proposta .incluso-chips{display:flex; flex-wrap:wrap; gap:6px}#aba-proposta .inc{
  border:1px solid var(--rosa); background:#fff; color:var(--rosa-escuro);
  border-radius:18px; padding:6px 12px 6px 26px; font-size:12.5px; cursor:pointer; position:relative;
}#aba-proposta .inc::before{content:'✓'; position:absolute; left:10px; font-size:11px}#aba-proposta .inc.off{border-color:#dcd3ca; background:#f4efe9; color:#aaa; text-decoration:line-through; padding-left:12px}#aba-proposta .inc.off::before{content:''}#aba-proposta .add-inc{display:flex; gap:7px; margin-top:9px}#aba-proposta .add-inc input{flex:1; padding:8px 11px; font-size:13.5px}#aba-proposta .add-inc button{flex:0 0 auto; width:40px; border:1px solid var(--rosa); background:#fff; color:var(--rosa-escuro); border-radius:10px; font-size:18px; cursor:pointer}/* itens */
#aba-proposta .item{display:flex; gap:8px; align-items:center; margin-top:8px}#aba-proposta .item input.desc{flex:1}#aba-proposta .item input.val{width:104px; text-align:right}#aba-proposta .item .rem{
  flex:0 0 auto; width:34px; height:34px; border:none; background:#f6edea;
  border-radius:9px; color:var(--rosa-escuro); font-size:16px; cursor:pointer;
}#aba-proposta .subnota{font-size:11.5px; color:var(--sub); margin-top:8px}/* imagem opcional */
#aba-proposta .dropzone{
  border:2px dashed #d8cfc6; border-radius:14px; padding:22px; text-align:center;
  color:var(--sub); cursor:pointer; background:#fdfbf9; transition:.15s;
}#aba-proposta .dropzone:active{background:#f7efe9}#aba-proposta .dropzone .emoji{font-size:30px; display:block; margin-bottom:6px}#aba-proposta .previa-img{position:relative; margin-top:4px}#aba-proposta .previa-img img{width:100%; border-radius:14px; display:block; border:1px solid var(--linha)}#aba-proposta .previa-img .trocar{position:absolute; right:8px; bottom:8px; background:rgba(255,255,255,.92);
  border:1px solid var(--linha); border-radius:10px; padding:6px 11px; font-size:12.5px; cursor:pointer}#aba-proposta .previa-img .tira{position:absolute; right:8px; top:8px; background:rgba(255,255,255,.92);
  border:1px solid var(--linha); border-radius:50%; width:30px; height:30px; font-size:15px; cursor:pointer}#aba-proposta .ajuste-img{margin-top:12px; padding:12px; background:#fdfbf9; border:1px solid var(--linha); border-radius:12px}#aba-proposta .ajuste-cab{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px}#aba-proposta .ajuste-cab span{font-size:12.5px; color:var(--rosa-escuro); font-weight:500}#aba-proposta .ajuste-cab button{border:1px solid var(--linha); background:#fff; border-radius:9px; padding:5px 10px; font-size:12px; cursor:pointer; color:var(--texto)}#aba-proposta .ajuste-img label{margin:8px 0 3px}#aba-proposta .ajuste-img label small{color:var(--sub); font-weight:400}#aba-proposta .ajuste-img input[type=range]{width:100%; accent-color:var(--rosa-escuro)}#aba-proposta .ajuste-img input[type=range]:disabled{accent-color:#d8cfc6; opacity:.5}#aba-proposta .ajuste-2col{display:flex; gap:12px}#aba-proposta .ajuste-2col>div{flex:1}/* preview */
#aba-proposta .palco-prev{
  background:#fff; border:1px solid var(--linha); border-radius:var(--raio);
  box-shadow:var(--sombra); padding:12px; overflow:hidden;
}#aba-proposta #svg-prev{width:100%; height:auto; display:block; border-radius:10px}#aba-proposta .barra-prev{display:flex; gap:8px; margin-top:12px}#aba-proposta .barra-prev .btn{margin-top:0; flex:1}#aba-proposta .fmt{display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap}#aba-proposta .fmt button{
  flex:1; border:1px solid var(--linha); background:#fff; border-radius:10px; padding:8px;
  font-size:12px; cursor:pointer; color:var(--sub); min-width:88px;
}#aba-proposta .fmt button.sel{border-color:var(--rosa); background:#fdf3f6; color:var(--rosa-escuro); font-weight:500}/* véu / modais */
#aba-proposta .veu{position:fixed; inset:0; background:rgba(40,30,28,.45); z-index:60; display:none;
  align-items:center; justify-content:center; padding:18px}#aba-proposta .veu.aberto{display:flex}#aba-proposta .modal{background:#fff; border-radius:20px; padding:20px; width:100%; max-width:440px; max-height:86vh; overflow:auto}#aba-proposta .modal h3{font-family:'Cormorant Garamond',serif; font-size:22px; margin:0 0 12px; text-align:center}#aba-proposta .modelo-linha{display:flex; align-items:center; gap:10px; padding:11px 4px; border-bottom:1px solid var(--linha)}#aba-proposta .modelo-linha:last-child{border:none}#aba-proposta .modelo-linha .nome{flex:1; font-size:14px}#aba-proposta .modelo-linha .nome small{display:block; color:var(--sub); font-size:11.5px}#aba-proposta .modelo-linha button{border:none; background:#f6edea; border-radius:9px; padding:7px 12px; font-size:12.5px; cursor:pointer; color:var(--rosa-escuro)}/* aviso */
