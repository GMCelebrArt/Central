<script>
/* ═══ Utilidades compartilhadas pelas três abas ═══ */
window.APP = { pin: '', quem: '', boot: null, img: { logo: null, logoContrato: null, fotos: {} } };

/* chama uma função do Code.gs e devolve Promise */
function srv(nome) {
  const args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (res, rej) {
    google.script.run
      .withSuccessHandler(res)
      .withFailureHandler(function (e) { rej(e instanceof Error ? e : new Error(String(e && e.message || e))); })
      .api(APP.pin, APP.quem, nome, JSON.stringify(args));
  });
}

/* aviso flutuante (aceita HTML só quando comHtml=true) */
function toast(msg, ms, comHtml) {
  const t = document.getElementById('toast');
  if (comHtml) t.innerHTML = msg; else t.textContent = msg;
  t.classList.add('ver');
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { t.classList.remove('ver'); }, ms || 2400);
}

/* escapa para usar dentro de HTML e de atributos */
function escHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/* copiar: no iframe do Apps Script o navigator.clipboard costuma ser bloqueado,
   então tenta execCommand (síncrono, dentro do toque), depois a API, e por fim abre o texto para copiar à mão */
function copiarTexto(txt, msgOk) {
  msgOk = msgOk || 'Copiado ✓';
  let ok = false;
  const ta = document.createElement('textarea');
  ta.value = txt; ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px';
  document.body.appendChild(ta);
  ta.select(); ta.setSelectionRange(0, txt.length);
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove();
  if (ok) { toast(msgOk); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(function () { toast(msgOk); }, function () { copiaManual(txt); });
  } else copiaManual(txt);
}
function copiaManual(txt) {
  const m = document.getElementById('modal-copia'), ta = document.getElementById('modal-copia-txt');
  ta.value = txt; m.classList.add('show');
  setTimeout(function () { ta.focus(); ta.select(); }, 50);
}

/* datas no fuso local (toISOString usa UTC e virava o dia depois das 21h) */
function hojeISO() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function isoParaBR(iso) {
  if (!iso) return '';
  const p = String(iso).split('-');
  return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso;
}

/* nomes próprios: mesma regra nas abas Proposta e Contrato ("Ana da Silva") */
const MINUSC = ['de', 'da', 'do', 'das', 'dos', 'e', 'di', 'du', 'del', 'dello', 'la', 'le'];
function titleCasePT(str) {
  return String(str || '').toLowerCase().replace(/\s+/g, ' ').trim().split(' ').map(function (w, i) {
    if (!w) return w;
    if (i > 0 && MINUSC.indexOf(w) >= 0) return w;
    return w.replace(/(^|['’\-])(\p{L})/gu, function (m, a, b) { return a + b.toUpperCase(); });
  }).join(' ');
}

const LSX = {
  get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
};
function jparse(s, fb) { try { const v = JSON.parse(s); return v == null ? fb : v; } catch (e) { return fb; } }

function cfg(k, fb) {
  const v = APP.boot && APP.boot.cfg ? APP.boot.cfg[k] : undefined;
  return (v === undefined || v === null || v === '') ? fb : v;
}
</script>
